<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MediPOS: pharmacy point of sale, inventory, purchasing and accounting" />
  <meta name="theme-color" content="#0f766e" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f766e'/%3E%3Cpath d='M12 6v12M6 12h12' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>MediPOS</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-state="boot">
  <div id="app">
    <section class="splash" role="status" aria-live="polite">
      <div class="splash-bg" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
      <div class="splash-core">
        <div class="splash-orbit" aria-hidden="true"><span class="ring r1"></span><span class="ring r2"></span><span class="arm a1"><span class="dot d1"></span></span><span class="arm a2"><span class="dot d2"></span></span></div>
        <div class="splash-logo"><div class="brand-mark big"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></div></div>
        <h1 class="splash-name">MediPOS</h1>
        <p class="splash-msg" id="splash-msg">Loading…</p>
        <div class="splash-bar" aria-hidden="true"><i></i></div>
      </div>
      <p class="splash-ver">Version 1.1.0</p>
    </section>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script>
    // If the app has not started after 12 seconds, say so instead of spinning forever.
    setTimeout(function () {
      if (document.body.dataset.state !== "boot") return;
      var m = document.getElementById("splash-msg");
      if (m) m.textContent = "This is taking longer than usual. Check your internet, then close and reopen the page.";
    }, 12000);
    window.addEventListener("error", function () {
      var m = document.getElementById("splash-msg");
      if (m && document.body.dataset.state === "boot") m.textContent = "Could not start MediPOS. Pull down to reload, or close and reopen the page.";
    });
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
